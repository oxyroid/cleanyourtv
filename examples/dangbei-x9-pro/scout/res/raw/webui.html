<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>DBOS Scout 控制台</title>
<style>
  :root { --bg:#0f1115; --card:#1a1e26; --line:#2a3040; --txt:#dfe6f0; --dim:#8b93a5; --ok:#3fb96b; --warn:#e8a33d; --bad:#e05b5b; --acc:#4a9eff; }
  * { box-sizing:border-box; margin:0; padding:0; }
  body { background:var(--bg); color:var(--txt); font:14px/1.6 -apple-system,"PingFang SC","Microsoft YaHei",sans-serif; padding:20px; max-width:860px; margin:0 auto; }
  h1 { font-size:18px; margin-bottom:4px; display:flex; align-items:center; gap:10px; }
  h1 .dot { width:10px; height:10px; border-radius:50%; background:var(--dim); }
  h1 .dot.on { background:var(--ok); box-shadow:0 0 8px var(--ok); }
  .sub { color:var(--dim); font-size:12px; margin-bottom:18px; }
  .grid { display:grid; grid-template-columns:repeat(auto-fit,minmax(240px,1fr)); gap:12px; }
  .card { background:var(--card); border:1px solid var(--line); border-radius:10px; padding:14px 16px; }
  .card h2 { font-size:13px; color:var(--dim); font-weight:600; margin-bottom:10px; letter-spacing:.5px; }
  .kv { display:flex; justify-content:space-between; padding:3px 0; font-size:13px; }
  .kv b { font-weight:400; color:var(--dim); }
  .kv span { font-family:ui-monospace,Menlo,monospace; }
  .toggle { display:flex; justify-content:space-between; align-items:center; padding:8px 0; border-bottom:1px solid var(--line); cursor:pointer; }
  .toggle:last-child { border-bottom:none; }
  .toggle .desc { color:var(--dim); font-size:12px; }
  .sw { position:relative; width:40px; height:22px; flex:none; }
  .sw input { display:none; }
  .sw i { position:absolute; inset:0; background:#333a48; border-radius:22px; transition:.2s; }
  .sw i:after { content:''; position:absolute; width:16px; height:16px; border-radius:50%; background:#fff; top:3px; left:3px; transition:.2s; }
  .sw input:checked + i { background:var(--ok); }
  .sw input:checked + i:after { left:21px; }
  .btns { display:flex; flex-wrap:wrap; gap:8px; }
  button { background:#242b3a; color:var(--txt); border:1px solid var(--line); border-radius:8px; padding:8px 14px; cursor:pointer; font-size:13px; }
  button:hover { border-color:var(--acc); color:var(--acc); }
  button:disabled { opacity:.4; cursor:default; }
  #shellbox { display:flex; gap:8px; margin-top:8px; }
  #cmd { flex:1; background:#12151c; border:1px solid var(--line); border-radius:8px; color:var(--txt); padding:8px 12px; font-family:ui-monospace,Menlo,monospace; font-size:13px; }
  #out { background:#12151c; border:1px solid var(--line); border-radius:8px; padding:10px 12px; margin-top:8px; font-family:ui-monospace,Menlo,monospace; font-size:12px; white-space:pre-wrap; max-height:220px; overflow:auto; color:#9fd0a0; display:none; }
  .toast { position:fixed; left:50%; bottom:24px; transform:translateX(-50%); background:#2a3348; border:1px solid var(--line); border-radius:8px; padding:8px 18px; font-size:13px; opacity:0; transition:.3s; pointer-events:none; }
  .toast.show { opacity:1; }
  .st-ok { color:var(--ok); } .st-bad { color:var(--bad); } .st-warn { color:var(--warn); }
</style>
</head>
<body>
<h1><span class="dot" id="dot"></span> DBOS Scout 控制台 <span id="ver" style="color:var(--dim);font-size:12px"></span></h1>
<div class="sub" id="dev"></div>

<div class="grid">
  <div class="card">
    <h2>设备状态</h2>
    <div class="kv"><b>型号</b><span id="m-model">-</span></div>
    <div class="kv"><b>IP</b><span id="m-ip">-</span></div>
    <div class="kv"><b>开机时长</b><span id="m-uptime">-</span></div>
    <div class="kv"><b>adbd</b><span id="m-adbd">-</span></div>
    <div class="kv"><b>桌面守护</b><span id="m-guard">-</span></div>
    <div class="kv"><b>守护目标</b><span id="m-target">-</span></div>
    <div class="kv"><b>音量链</b><span id="m-vol" style="font-size:11px">-</span></div>
    <div class="kv"><b>音量曲线</b><span id="m-curve">-</span></div>
    <div class="kv"><b>logd</b><span id="m-logd">-</span></div>
    <div class="kv"><b>服务状态</b><span id="m-status" style="font-size:12px">-</span></div>
  </div>

  <div class="card">
    <h2>功能开关（决定权在你）</h2>
    <label class="toggle"><div>桌面守护<div class="desc">原厂桌面冒头自动切回你的 launcher</div></div>
      <span class="sw"><input type="checkbox" data-k="homeguard_on" id="sw1"><i></i></span></label>
    <label class="toggle"><div>开机桌面纠偏<div class="desc">开机后确保进入你的 launcher</div></div>
      <span class="sw"><input type="checkbox" data-k="homefix_on" id="sw2"><i></i></span></label>
    <label class="toggle"><div>开机自动 ADB<div class="desc">开机后自动拉起 adbd（远程救生通道）</div></div>
      <span class="sw"><input type="checkbox" data-k="adbd_on" id="sw3"><i></i></span></label>
    <label class="toggle"><div>IP 广播<div class="desc">开机后向局域网广播位置，根治 IP 漂移</div></div>
      <span class="sw"><input type="checkbox" data-k="announce_on" id="sw4"><i></i></span></label>
    <label class="toggle"><div>调试日志 logd<div class="desc">系统 logd 出厂被关闭；开启后 Scout 自动拉起，logcat 可用</div></div>
      <span class="sw"><input type="checkbox" data-k="logd_on" id="sw5b"><i></i></span></label>
  </div>

  <div class="card">
    <h2>better-audio（音量预制曲线）</h2>
    <div class="btns" id="curves">
      <button data-c="stock">stock 原厂</button>
      <button data-c="fine100">fine100 百阶精调</button>
      <button data-c="step30">step30 三十阶</button>
      <button data-c="perceptual">perceptual 感知</button>
    </div>
    <div class="desc" id="curve-info" style="color:var(--dim);font-size:12px;margin-top:8px"></div>
    <div style="color:var(--dim);font-size:12px;margin-top:4px">
      stock=±5步进+原厂音量条 · fine100=100阶1:1（夜间推荐配合增益） ·
      step30=每按±3~4 · perceptual=40阶感知曲线（低段每阶恰1内部值）
    </div>
    <div class="kv" style="margin-top:8px"><b>高级微调（一般不动）</b><span></span></div>
    <label class="toggle"><div>曲线校正总开关<div class="desc">关=纯原生单格旁听，浮层也不弹</div></div>
      <span class="sw"><input type="checkbox" data-k="finevol_on" id="sw5"><i></i></span></label>
    <label class="toggle"><div>覆盖系统音量条<div class="desc">掐原厂 OSD，由 Scout 浮层接管显示</div></div>
      <span class="sw"><input type="checkbox" data-k="volosd_on" id="sw6"><i></i></span></label>
    <label class="toggle"><div>夜间 DP 增益<div class="desc">音量 1-3 档输出混音 -18/-12/-6dB（1 还是太响的解法）</div></div>
      <span class="sw"><input type="checkbox" data-k="nightgain_on" id="sw7"><i></i></span></label>
    <div class="btns" style="margin-top:8px">
      <button onclick="api('/config?volcurve=stock','已切回原厂音量（如需原厂音量条，请重启设备一次）')">恢复原厂音量</button>
      <button onclick="api('/reset','Scout 配置已重置为默认')">重置 Scout 配置</button>
    </div>
  </div>

  <div class="card">
    <h2>音量微调</h2>
    <div class="btns">
      <button onclick="volAdj(-5)">音量 −5</button>
      <button onclick="volAdj(-1)">−1 格</button>
      <button onclick="volAdj(1)">+1 格</button>
      <button onclick="volAdj(5)">音量 +5</button>
      <span id="vol-now" style="color:var(--dim)"></span>
    </div>
  </div>

  <div class="card">
    <h2>快捷操作</h2>
    <div class="btns">
      <button onclick="api('/adbstart')">拉起 ADB</button>
      <button onclick="api('/homefix')">桌面纠偏</button>
      <button onclick="api('/homeguard')">修复守护授权</button>
      <button onclick="api('/homeguard?action=off')">关闭守护授权</button>
      <button onclick="refresh()">刷新状态</button>
    </div>
  </div>

  <div class="card">
    <h2>远程终端（ADB shell）</h2>
    <div id="shellbox">
      <input id="cmd" placeholder="输入 shell 命令，如 dumpsys window | grep mCurrentFocus" onkeydown="if(event.key==='Enter')runCmd()">
      <button onclick="runCmd()">执行</button>
    </div>
    <div id="out"></div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
const K = location.search.match(/k=([^&]+)/) ? location.search.match(/k=([^&]+)/)[1] : 'S9x7Kp2mQw4';
const base = 'http://' + location.host;
const q = (p) => base + p + (p.includes('?') ? '&' : '?') + 'k=' + K;

function toast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg; t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 2000);
}

async function api(path, msg) {
  try {
    const r = await fetch(q(path));
    const j = await r.json();
    toast(msg || (j.ok ? '已执行' : (j.error || '完成')));
    refresh();
  } catch (e) { toast('请求失败: ' + e); }
}

async function volAdj(delta) {
  try {
    const r = await fetch(q('/vol?i=' + (delta > 0 ? '%2B' + delta : delta)));
    const j = await r.json();
    document.getElementById('vol-now').textContent = '当前: ' + j.vol + ' / ' + j.max;
    toast('音量 ' + j.vol + ' / ' + j.max);
  } catch (e) { toast('请求失败: ' + e); }
}

async function refresh() {
  try {
    const r = await fetch(q('/whoami'));
    const d = await r.json();
    document.getElementById('dot').className = 'dot on';
    document.getElementById('ver').textContent = 'v' + d.ver;
    document.getElementById('dev').textContent = d.model + ' · Android ' + d.android + ' · http://' + d.ip + ':' + d.http;
    document.getElementById('m-model').textContent = d.model;
    document.getElementById('m-ip').textContent = d.ips.join(', ');
    const up = parseFloat(d.uptime || 0) / 60;
    document.getElementById('m-uptime').textContent = up.toFixed(0) + ' 分钟';
    const ad = document.getElementById('m-adbd');
    ad.textContent = d.adbd + (d.adbdPort ? ' :' + d.adbdPort : '');
    ad.className = d.adbd === 'running' ? 'st-ok' : 'st-bad';
    const g = document.getElementById('m-guard');
    g.textContent = d.guard ? '在线' : '离线';
    g.className = d.guard ? 'st-ok' : 'st-bad';
    document.getElementById('m-target').textContent = d.guardTarget || '-';
    document.getElementById('m-vol').textContent = d.volNative || '-';
    document.getElementById('m-curve').textContent = (d.volCurve || '-') + ' (' + (d.curveSteps || '?') + '阶)';
    const lg = document.getElementById('m-logd');
    lg.textContent = d.logd || '-';
    lg.className = d.logd === 'running' ? 'st-ok' : 'st-dim';
    const cur = d.volCurve || 'fine100';
    document.querySelectorAll('#curves button').forEach(b => {
      b.style.borderColor = b.dataset.c === cur ? 'var(--acc)' : 'var(--line)';
      b.style.color = b.dataset.c === cur ? 'var(--acc)' : 'var(--txt)';
    });
    document.getElementById('curve-info').textContent = '当前预制: ' + cur +
      (cur === 'stock' ? ' —— 原厂 ±5 步进、原厂音量条' :
       cur === 'fine100' ? ' —— 100 阶 1:1，原生单格，浮层显示精确值' :
       cur === 'step30' ? ' —— 30 阶线性，每按 ±3~4 内部值' :
       ' —— 40 阶感知曲线，低段每阶恰 1 内部值（夜间最细）') +
      ' · 切换只重映射阶，实际音量不变';
    const st = document.getElementById('m-status');
    st.textContent = (d.guardStatus ? d.guardStatus + ' | ' : '') + d.status;
  } catch (e) {
    document.getElementById('dot').className = 'dot';
  }
  try {
    const r = await fetch(q('/config'));
    const c = await r.json();
    for (const k in c) {
      const el = document.querySelector('[data-k=' + k + ']');
      if (el) el.checked = c[k];
    }
  } catch (e) {}
}

document.querySelectorAll('.sw input').forEach(el => {
  el.addEventListener('change', async () => {
    const k = el.dataset.k, v = el.checked;
    await fetch(q('/config?' + k + '=' + (v ? 1 : 0)));
    toast(k + ' → ' + (v ? '开' : '关'));
    setTimeout(refresh, 500);
  });
});

document.querySelectorAll('#curves button').forEach(el => {
  el.addEventListener('click', async () => {
    await fetch(q('/config?volcurve=' + el.dataset.c));
    toast('better-audio → ' + el.dataset.c);
    setTimeout(refresh, 500);
  });
});

async function runCmd() {
  const c = document.getElementById('cmd').value.trim();
  if (!c) return;
  const out = document.getElementById('out');
  out.style.display = 'block';
  out.textContent = '执行中...';
  try {
    const r = await fetch(q('/sh?c=' + encodeURIComponent(c)));
    const j = await r.json();
    out.textContent = '$ ' + c + '\n' + (j.out || j.error || '(空)');
  } catch (e) { out.textContent = '失败: ' + e; }
}

refresh();
setInterval(refresh, 5000);
</script>
</body>
</html>
